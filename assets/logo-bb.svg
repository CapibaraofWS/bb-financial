      M11.2 19 L15 19
        Q18.2 19 18.2 22.5
        Q18.2 25 15 25
        L11.2 25 Z
    "/>

  <!-- Arrow up-right -->
  <line x1="18.5" y1="25" x2="27" y2="11.5"
        stroke="#4ade9a" stroke-width="2" stroke-linecap="round"/>
  <polyline points="21.5,12 27,11.5 26.5,17"
