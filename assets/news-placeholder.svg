<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#11161e"/>
      <stop offset="100%" stop-color="#0e1c14"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1a2530" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="320" height="180" fill="url(#bg)"/>
  <rect width="320" height="180" fill="url(#grid)" opacity="0.5"/>

  <!-- Shield logo centered -->
  <g transform="translate(135, 50)">
    <path d="M0 0 L26 0 L26 18 Q26 29 13 33.5 Q0 29 0 18 Z"
          fill="#0e1c14" stroke="#4ade9a" stroke-width="1.5" stroke-linejoin="round"/>
    <path fill-rule="evenodd" fill="#4ade9a"
      d="M5 7 L5 24 L11.5 24 Q16.5 24 16.5 19 Q16.5 16 14 15 Q16 14 16 11 Q16 7 11 7 Z
         M7.2 9 L10.5 9 Q13.6 9 13.6 11.5 Q13.6 14 10.5 14 L7.2 14 Z
         M7.2 16 L11 16 Q14.2 16 14.2 19.5 Q14.2 22 11 22 L7.2 22 Z"/>
    <line x1="14.5" y1="22" x2="23" y2="8.5" stroke="#4ade9a" stroke-width="2" stroke-linecap="round"/>
    <polyline points="17.5,9 23,8.5 22.5,14" fill="none" stroke="#4ade9a" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Text -->
  <text x="160" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="600" fill="#a8c4b0" letter-spacing="0.5">Noticias Financieras</text>
  <text x="160" y="140" text-anchor="middle" font-family="monospace" font-size="9" fill="#3d4558" letter-spacing="2">BB FINANCIAL</text>
</svg>
